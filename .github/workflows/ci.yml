# Plugin self-checks: unit tests (node:test, zero dependencies) and `claude plugin validate --strict`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .

  actionlint:
    # Lint the workflows the plugin renders (several answer variants), including shellcheck on their run scripts.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Render the workflow templates
        run: node test/support/render-workflows.mjs "$RUNNER_TEMP/rendered"
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          # `copilot-requests: write` is a real GitHub permission (the Copilot CLI needs it) that this actionlint
          # version does not know yet; ignore exactly that message.
          ./actionlint -color -ignore 'unknown permission scope "copilot-requests"' "$RUNNER_TEMP"/rendered/*/.github/workflows/*.yml
      - name: The GitLab CI files parse as YAML
        run: ruby -ryaml -e 'ARGV.each { |f| YAML.load_file(f); puts "ok #{f}" }' "$RUNNER_TEMP"/rendered/gitlab-*/.gitlab-ci.yml "$RUNNER_TEMP"/rendered/gitlab-*/.gitlab/*.yml
